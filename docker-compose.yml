services:
  frontend:
    platform: linux/arm64
    build: ./kyc-ocr-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ./kyc-ocr-frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:5001
    develop:
      watch:
        - action: sync
          path: ./kyc-ocr-frontend/src
          target: /app/src
        - action: rebuild
          path: ./kyc-ocr-frontend/package.json

  backend:
    platform: linux/arm64
    build: ./kyc-ocr-backend
    ports:
      - "5001:5000"
    command: ["npm", "start"]
    volumes:
      - ./kyc-ocr-backend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./kyc-ocr-backend
          target: /app
        - action: rebuild
          path: ./kyc-ocr-backend/package.json

